<svg xmlns="http://www.w3.org/2000/svg" class="pf-chart" viewBox="0 0 720 228" width="720" height="228" role="img" aria-labelledby="title desc"><title id="title">What we tested</title><desc id="desc">Three made-up people, four kinds of notes, two AI assistants and an AI judge that scored 192 replies without being told which note was used.</desc><style>svg.pf-chart{--surface:#fcfcfb;--card:#ffffff;--border:#e4e3df;--frame:#8e8d87;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#6f6e69;--series-1:#2a78d6;--series-2:#eb6834;--series-muted:#a9a8a2;--accent:#1f6fc7}@media (prefers-color-scheme: dark){svg.pf-chart{--surface:#1a1a19;--card:#222220;--border:#3a3936;--frame:#6f6e69;--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#9c9b93;--series-1:#3987e5;--series-2:#d95926;--series-muted:#6f6e69;--accent:#5aa9f0}}text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}.bg{fill:var(--surface)} .card{fill:var(--card);stroke:var(--border);stroke-width:1}.t1{fill:var(--text-primary)} .t2{fill:var(--text-secondary)} .t3{fill:var(--text-muted)}.head{font-size:18px;font-weight:600} .sub{font-size:12.5px} .lab{font-size:12px}.small{font-size:11.5px} .big{font-size:24px;font-weight:600}.num{font-variant-numeric:tabular-nums} .grid{stroke:var(--border);stroke-width:1}.s1{fill:var(--series-1)} .s2{fill:var(--series-2)} .sm{fill:var(--series-muted)}.lm{stroke:var(--series-muted);stroke-width:2;stroke-linecap:round}.ring{stroke:var(--surface);stroke-width:2} .inbar{fill:#fff;font-weight:600}.box{fill:var(--card);stroke:var(--frame);stroke-width:1}.boxa{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.ttl{fill:var(--accent);font-size:13px;font-weight:600}.arrow{stroke:var(--frame);stroke-width:1.5;fill:none} .tip{fill:var(--frame)}</style><rect class="bg" width="720" height="228" rx="10"/><text x="24.0" y="36.0" class="t1 head" text-anchor="start">What we tested</text><text x="24.0" y="58.0" class="t3 sub" text-anchor="start">Each made-up person gave the assistants a different kind of note about themselves.</text><rect class="box" x="24.0" y="80.0" width="153.0" height="104.0" rx="6"/><text x="36.0" y="104.0" class="ttl" text-anchor="start">3 made-up people</text><text x="36.0" y="124.0" class="t2 small" text-anchor="start">tired senior dev</text><text x="36.0" y="141.0" class="t2 small" text-anchor="start">keen junior dev</text><text x="36.0" y="158.0" class="t2 small" text-anchor="start">demanding manager</text><path class="arrow" d="M177.0,132.0 L191.0,132.0"/><path class="tip" d="M197.0,132.0 l-7,-4 v8 z"/><rect class="box" x="197.0" y="80.0" width="153.0" height="104.0" rx="6"/><text x="209.0" y="104.0" class="ttl" text-anchor="start">4 kinds of notes</text><text x="209.0" y="124.0" class="t2 small" text-anchor="start">none</text><text x="209.0" y="141.0" class="t2 small" text-anchor="start">short note</text><text x="209.0" y="158.0" class="t2 small" text-anchor="start">settings / profile</text><path class="arrow" d="M350.0,132.0 L364.0,132.0"/><path class="tip" d="M370.0,132.0 l-7,-4 v8 z"/><rect class="box" x="370.0" y="80.0" width="153.0" height="104.0" rx="6"/><text x="382.0" y="104.0" class="ttl" text-anchor="start">2 AI assistants</text><text x="382.0" y="124.0" class="t2 small" text-anchor="start">Claude Code</text><text x="382.0" y="141.0" class="t2 small" text-anchor="start">Codex</text><text x="382.0" y="158.0" class="t2 small" text-anchor="start">same 4 work tasks</text><path class="arrow" d="M523.0,132.0 L537.0,132.0"/><path class="tip" d="M543.0,132.0 l-7,-4 v8 z"/><rect class="boxa" x="543.0" y="80.0" width="153.0" height="104.0" rx="6"/><text x="555.0" y="104.0" class="ttl" text-anchor="start">An AI judge</text><text x="555.0" y="124.0" class="t2 small" text-anchor="start">scored 192 replies</text><text x="555.0" y="141.0" class="t2 small" text-anchor="start">not told which</text><text x="555.0" y="158.0" class="t2 small" text-anchor="start">note was used</text><text x="24.0" y="212.0" class="t3 small" text-anchor="start">Test with 3 made-up people, not real users. Details: docs/evaluation-summary.md</text></svg>
