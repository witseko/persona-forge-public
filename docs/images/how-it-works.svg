<svg xmlns="http://www.w3.org/2000/svg" class="pf-chart" viewBox="0 0 720 210" width="720" height="210" role="img" aria-labelledby="title desc"><title id="title">How persona-forge works</title><desc id="desc">Answer a questionnaire, keep or drop each statement about you, and get a profile with assistant personas that Claude Code and Codex use.</desc><style>svg.pf-chart{--surface:#fcfcfb;--card:#ffffff;--border:#e4e3df;--frame:#8e8d87;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#6f6e69;--series-1:#2a78d6;--series-2:#eb6834;--series-muted:#a9a8a2;--accent:#1f6fc7}@media (prefers-color-scheme: dark){svg.pf-chart{--surface:#1a1a19;--card:#222220;--border:#3a3936;--frame:#6f6e69;--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#9c9b93;--series-1:#3987e5;--series-2:#d95926;--series-muted:#6f6e69;--accent:#5aa9f0}}text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}.bg{fill:var(--surface)} .card{fill:var(--card);stroke:var(--border);stroke-width:1}.t1{fill:var(--text-primary)} .t2{fill:var(--text-secondary)} .t3{fill:var(--text-muted)}.head{font-size:18px;font-weight:600} .sub{font-size:12.5px} .lab{font-size:12px}.small{font-size:11.5px} .big{font-size:24px;font-weight:600}.num{font-variant-numeric:tabular-nums} .grid{stroke:var(--border);stroke-width:1}.s1{fill:var(--series-1)} .s2{fill:var(--series-2)} .sm{fill:var(--series-muted)}.lm{stroke:var(--series-muted);stroke-width:2;stroke-linecap:round}.ring{stroke:var(--surface);stroke-width:2} .inbar{fill:#fff;font-weight:600}.box{fill:var(--card);stroke:var(--frame);stroke-width:1}.boxa{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.ttl{fill:var(--accent);font-size:13px;font-weight:600}.arrow{stroke:var(--frame);stroke-width:1.5;fill:none} .tip{fill:var(--frame)}</style><rect class="bg" width="720" height="210" rx="10"/><text x="24.0" y="36.0" class="t1 head" text-anchor="start">How persona-forge works</text><text x="24.0" y="58.0" class="t3 sub" text-anchor="start">Everything stays in a private folder on your computer.</text><rect class="box" x="24.0" y="80.0" width="160.0" height="96.0" rx="6"/><text x="36.0" y="104.0" class="ttl" text-anchor="start">1. Questionnaire</text><text x="36.0" y="124.0" class="t2 small" text-anchor="start">questions about you</text><text x="36.0" y="141.0" class="t2 small" text-anchor="start">+ work situations</text><text x="36.0" y="158.0" class="t2 small" text-anchor="start">+ your preferences</text><path class="arrow" d="M184.0,128.0 L198.7,128.0"/><path class="tip" d="M204.7,128.0 l-7,-4 v8 z"/><rect class="box" x="204.7" y="80.0" width="160.0" height="96.0" rx="6"/><text x="216.7" y="104.0" class="ttl" text-anchor="start">2. You review</text><text x="216.7" y="124.0" class="t2 small" text-anchor="start">keep or drop</text><text x="216.7" y="141.0" class="t2 small" text-anchor="start">each statement</text><text x="216.7" y="158.0" class="t2 small" text-anchor="start">about you</text><path class="arrow" d="M364.7,128.0 L379.3,128.0"/><path class="tip" d="M385.3,128.0 l-7,-4 v8 z"/><rect class="boxa" x="385.3" y="80.0" width="160.0" height="96.0" rx="6"/><text x="397.3" y="104.0" class="ttl" text-anchor="start">3. Your profile</text><text x="397.3" y="124.0" class="t2 small" text-anchor="start">how you like to work</text><text x="397.3" y="141.0" class="t2 small" text-anchor="start">+ assistant personas</text><text x="397.3" y="158.0" class="t2 small" text-anchor="start">+ private report</text><rect class="box" x="566.0" y="70.0" width="130.0" height="56.0" rx="6"/><text x="578.0" y="94.0" class="ttl" text-anchor="start">Claude Code</text><text x="578.0" y="114.0" class="t2 small" text-anchor="start">rules + styles</text><rect class="box" x="566.0" y="130.0" width="130.0" height="56.0" rx="6"/><text x="578.0" y="154.0" class="ttl" text-anchor="start">Codex</text><text x="578.0" y="174.0" class="t2 small" text-anchor="start">codex -p</text><path class="arrow" d="M545.3,120.0 L560.0,98.0"/><path class="tip" d="M566.0,98.0 l-7,-4 v8 z"/><path class="arrow" d="M545.3,136.0 L560.0,158.0"/><path class="tip" d="M566.0,158.0 l-7,-4 v8 z"/></svg>
