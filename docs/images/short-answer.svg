<svg xmlns="http://www.w3.org/2000/svg" class="pf-chart" viewBox="0 0 720 226" width="720" height="226" role="img" aria-labelledby="title desc"><title id="title">The short answer</title><desc id="desc">Correct answers stayed the same with a profile. It was a bit better than no instructions, too small to be sure, and worse than a short 5-line note.</desc><style>svg.pf-chart{--surface:#fcfcfb;--card:#ffffff;--border:#e4e3df;--frame:#8e8d87;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#6f6e69;--series-1:#2a78d6;--series-2:#eb6834;--series-muted:#a9a8a2;--accent:#1f6fc7}@media (prefers-color-scheme: dark){svg.pf-chart{--surface:#1a1a19;--card:#222220;--border:#3a3936;--frame:#6f6e69;--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#9c9b93;--series-1:#3987e5;--series-2:#d95926;--series-muted:#6f6e69;--accent:#5aa9f0}}text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}.bg{fill:var(--surface)} .card{fill:var(--card);stroke:var(--border);stroke-width:1}.t1{fill:var(--text-primary)} .t2{fill:var(--text-secondary)} .t3{fill:var(--text-muted)}.head{font-size:18px;font-weight:600} .sub{font-size:12.5px} .lab{font-size:12px}.small{font-size:11.5px} .big{font-size:24px;font-weight:600}.num{font-variant-numeric:tabular-nums} .grid{stroke:var(--border);stroke-width:1}.s1{fill:var(--series-1)} .s2{fill:var(--series-2)} .sm{fill:var(--series-muted)}.lm{stroke:var(--series-muted);stroke-width:2;stroke-linecap:round}.ring{stroke:var(--surface);stroke-width:2} .inbar{fill:#fff;font-weight:600}.box{fill:var(--card);stroke:var(--frame);stroke-width:1}.boxa{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.ttl{fill:var(--accent);font-size:13px;font-weight:600}.arrow{stroke:var(--frame);stroke-width:1.5;fill:none} .tip{fill:var(--frame)}</style><rect class="bg" width="720" height="226" rx="10"/><text x="24.0" y="36.0" class="t1 head" text-anchor="start">The short answer</text><text x="24.0" y="58.0" class="t3 sub" text-anchor="start">Does a persona-forge profile help AI assistants work with you?</text><rect class="card" x="24.0" y="78" width="216.0" height="104" rx="10"/><text x="40.0" y="104.0" class="t3 lab" text-anchor="start">Correct answers</text><text x="40.0" y="142.0" class="t1 big" text-anchor="start">Same</text><text x="40.0" y="166.0" class="t2 lab" text-anchor="start">with or without a profile</text><rect class="card" x="252.0" y="78" width="216.0" height="104" rx="10"/><text x="268.0" y="104.0" class="t3 lab" text-anchor="start">Compared with nothing</text><text x="268.0" y="142.0" class="t1 big" text-anchor="start">A bit better</text><text x="268.0" y="166.0" class="t2 lab" text-anchor="start">too small to be sure</text><rect class="card" x="480.0" y="78" width="216.0" height="104" rx="10"/><text x="496.0" y="104.0" class="t3 lab" text-anchor="start">Compared with a short note</text><text x="496.0" y="142.0" class="t1 big" text-anchor="start">Worse</text><text x="496.0" y="166.0" class="t2 lab" text-anchor="start">a 5-line note did better</text><text x="24.0" y="210.0" class="t3 small" text-anchor="start">Test with 3 made-up people, not real users. Details: docs/evaluation-summary.md</text></svg>
