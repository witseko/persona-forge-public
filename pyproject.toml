[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "persona-forge"
version = "0.1.0"
description = "Local psychometric work profiles and coding-agent personas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["questionary==2.1.1", "rich==14.2.0"]

[project.scripts]
persona-forge = "persona_forge.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.1", "pip-audit==2.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/persona_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
